<svg xmlns="http://www.w3.org/2000/svg" width="86" height="32" viewBox="0 0 86 32" fill="none" role="img" aria-label="Tech stack">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif; font-size: 13px; font-weight: 600;
          letter-spacing: .1px; }
    .b { animation: pop .55s cubic-bezier(.2,.85,.3,1) backwards,
                     float 3.6s ease-in-out infinite; }
    @keyframes pop {
      from { opacity: 0; transform: translateY(9px) scale(.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1);   }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .b { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <g class="b" style="animation-delay:0.0s,1.0s"><rect x="0.1" y="0" width="85.7" height="32" rx="8" fill="#ea4335" stroke="#b73429" stroke-opacity=".5"/><rect x="0.1" y="0" width="85.7" height="32" rx="8" fill="url(#sheen)"/><g transform="translate(13.1 8.5) scale(0.62500)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#ffffff" fill-opacity=".95"/></g><text x="35.1" y="20.6" fill="#ffffff" class="t">Gmail</text></g>
</svg>
